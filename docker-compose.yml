name: gotrips

services:
  # PostgreSQL Database
  gotrips-db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    # Chỉ mở cho máy local (để chạy API bằng IDE / mvnw), không mở ra mạng ngoài
    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - gotrips-network
  # Spring Boot Backend
  gotrips-api:
    build:
      context: ./gotrips-api
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://gotrips-db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8080
      # Khoá ký JWT: bắt buộc, API không khởi động nếu thiếu (xem .env.example)
      GOTRIPS_JWT_SECRET: "${GOTRIPS_JWT_SECRET:?Chưa đặt GOTRIPS_JWT_SECRET trong .env, tạo bằng lệnh openssl rand -base64 48}"
      GOTRIPS_JWT_ADMIN_EXPIRATION: ${GOTRIPS_JWT_ADMIN_EXPIRATION:-8h}
      # Compose local chạy HTTP; môi trường HTTPS đặt true.
      GOTRIPS_ADMIN_COOKIE_SECURE: ${GOTRIPS_ADMIN_COOKIE_SECURE:-false}
      # Profile `seed` nạp dữ liệu mẫu danh mục (db/seed). Mặc định BẬT cho dev/Docker; môi trường thật đặt
      # SPRING_PROFILES_ACTIVE= (rỗng) trong .env. Dấu `-` (không phải `:-`) để giá trị rỗng được tôn trọng.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE-seed}
      # Tài khoản nhận chuyển khoản. CỐ Ý để trống giá trị (truyền qua từ .env/shell, không đặt thì container không có
      # biến này): viết ${GOTRIPS_BANK_NAME:-} sẽ truyền chuỗi RỖNG và đè mất giá trị thử nghiệm của profile seed.
      GOTRIPS_BANK_NAME:
      GOTRIPS_BANK_ACCOUNT_NUMBER:
      GOTRIPS_BANK_ACCOUNT_NAME:
      # Thanh toán qua SePay (tuỳ chọn, để trống giá trị như trên): mã ngân hàng cho ảnh VietQR, và Secret Key HMAC của
      # webhook. Không đặt khoá thì API tắt nhận webhook, nhân viên vẫn đánh dấu đã thu bằng tay.
      GOTRIPS_BANK_QR_CODE:
      GOTRIPS_SEPAY_WEBHOOK_SECRET:
      # Cũng cố ý để trống giá trị: không đặt thì API dùng danh sách nguồn ảnh mặc định.
      GOTRIPS_CATALOG_ALLOWED_IMAGE_PREFIXES:
      GOTRIPS_WEB_REVALIDATE_URL: ${GOTRIPS_WEB_REVALIDATE_URL:-}
      GOTRIPS_REVALIDATE_SECRET: ${GOTRIPS_REVALIDATE_SECRET:-}

    depends_on:
      gotrips-db:
        condition: service_healthy

    # Gọi /actuator/health, phải trả về "UP" (bao gồm kiểm tra kết nối DB)
    healthcheck:
      test:
        - CMD-SHELL
        - |
          bash -c 'exec 3<>/dev/tcp/localhost/8080; echo "GET /actuator/health HTTP/1.0" >&3; echo >&3; grep -q \"status\":\"UP\" <&3'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

    networks:
      - gotrips-network
  # React Vite Admin
  gotrips-admin:
    build:
      context: ./gotrips-admin
      dockerfile: Dockerfile
      args:
        # Nhúng vào admin lúc build (liên kết "Xem trên website"); đổi giá trị thì phải build lại image.
        VITE_WEB_URL: ${VITE_WEB_URL:-http://localhost:3000}

    restart: unless-stopped

    ports:
      - "8081:80"

    depends_on:
      gotrips-api:
        condition: service_healthy

    networks:
      - gotrips-network
  # Next.js Customer Website
  gotrips-web:
    build:
      context: ./gotrips-web
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      # Địa chỉ API mà web gọi từ phía server (Server Component / Server Action), đọc lúc chạy chứ không nhúng lúc build
      API_URL: http://gotrips-api:8080
      GOTRIPS_REVALIDATE_SECRET: ${GOTRIPS_REVALIDATE_SECRET:-}

    depends_on:
      gotrips-api:
        condition: service_healthy

    networks:
      - gotrips-network

volumes:
  postgres_data:

networks:
  gotrips-network:
    driver: bridge