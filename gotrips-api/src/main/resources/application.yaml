spring:
  application:
    name: gotrips-api

  # Kết nối PostgreSQL.
  # Trong Docker: lấy từ biến môi trường do docker-compose truyền vào.
  # Chạy local (IDE / mvnw): dùng giá trị mặc định sau dấu ":" (DB mở ở localhost:5432).
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gotrips}
    username: ${SPRING_DATASOURCE_USERNAME:gotrips}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}

  jpa:
    hibernate:
      ddl-auto: validate # schema do Flyway quản lý, Hibernate chỉ kiểm tra
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Cho phép khởi động khi chưa có file migration nào
    fail-on-missing-locations: false

  # Lỗi MVC trả ProblemDetail (RFC 9457), khớp với GlobalExceptionHandler
  mvc:
    problemdetails:
      enabled: true

# Tài liệu API (springdoc). Orval đọc /v3/api-docs để sinh client cho admin.
# Đặt SPRINGDOC_ENABLED=false để tắt hẳn
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}

# CORS cho admin (SPA gọi API từ trình duyệt). Nhiều origin cách nhau bằng dấu phẩy
gotrips:
  cors:
    allowed-origins: ${GOTRIPS_CORS_ORIGINS:http://localhost:8081,http://localhost:5173}

  # Tài khoản nhận chuyển khoản hiển thị trong chi tiết đơn. KHÔNG có giá trị mặc định ở đây (xem
  # BankTransferProperties): dev/Docker lấy giá trị thử nghiệm ở application-seed.yaml; môi trường thật đặt 3 biến này.
  payment:
    bank-transfer:
      bank-name: ${GOTRIPS_BANK_NAME:}
      account-number: ${GOTRIPS_BANK_ACCOUNT_NUMBER:}
      account-name: ${GOTRIPS_BANK_ACCOUNT_NAME:}

  web-revalidation:
    url: ${GOTRIPS_WEB_REVALIDATE_URL:}
    secret: ${GOTRIPS_REVALIDATE_SECRET:}

  catalog:
    # URL ảnh mà trang quản trị được lưu (nhiều tiền tố cách nhau bằng dấu phẩy). Đổi ở đây thì phải đổi
    # images.remotePatterns trong next.config.ts của web và img-src trong nginx.conf của admin.
    allowed-image-prefixes: ${GOTRIPS_CATALOG_ALLOWED_IMAGE_PREFIXES:https://images.unsplash.com/photo-}

  admin:
    cookie-secure: ${GOTRIPS_ADMIN_COOKIE_SECURE:true}

  # JWT cho đăng nhập. KHÔNG có giá trị mặc định cho secret (xem JwtProperties): đặt GOTRIPS_JWT_SECRET
  # trong .env (Docker) hoặc biến môi trường khi chạy bằng IDE/mvnw. Tạo khoá: openssl rand -base64 48
  jwt:
    secret: ${GOTRIPS_JWT_SECRET:}
    # Cùng thời hạn với cookie phiên của gotrips-web (7 ngày). Chưa có refresh token.
    expiration: ${GOTRIPS_JWT_EXPIRATION:7d}
    admin-expiration: ${GOTRIPS_JWT_ADMIN_EXPIRATION:8h}
    issuer: gotrips-api

# Actuator: chỉ expose health + info, không lộ endpoint nhạy cảm
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
